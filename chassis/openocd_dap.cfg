# CMSIS-DAP probe configuration for STM32F4 targets.
# ATK-HS-V3 exposes CMSIS-DAP over HID on Windows. OpenOCD's automatic
# backend selection prefers usb_bulk for this probe, which leaves
# Cortex-Debug unable to start after the workspace is reopened. Force the
# HID backend so launch, attach, and download all use the path that works.
source [find interface/cmsis-dap.cfg]
cmsis_dap_backend hid
transport select swd
source [find target/stm32f4x.cfg]
adapter speed 2000
